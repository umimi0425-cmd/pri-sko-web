<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送信完了 | スキンラボオンライン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/form/style.css">
</head>
<body>

  <header class="header">
    <p class="header-logo">スキンラボオンライン</p>
  </header>

  <main class="wrap">
    <div class="done-view">
      <div class="done-check">✓</div>
      <h2 class="done-title">送信が完了しました。</h2>
      <div class="done-order-box">
        <p class="done-order-label">注文番号</p>
        <p class="done-order-id" id="done-order-id"></p>
      </div>
      <p class="done-text" id="done-message"></p>
      <p id="done-fallback" class="done-fallback hidden">
        <a id="done-payment-link" class="done-payment-link" href="#"></a>
      </p>
      <button class="btn-close" id="close-btn">閉じる</button>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const orderId = params.get('order_id') || '';
    const lineSuccess = params.get('line') === '1';

    document.getElementById('done-order-id').textContent = orderId;

    const paymentUrl = `https://skinlabonline.inside-story.info/payment-report?order_id=${orderId}`;

    if (lineSuccess) {
      document.getElementById('done-message').textContent = '入金完了後は、LINEトークに届いたURLからご報告ください。';
    } else {
      document.getElementById('done-message').textContent = '入金完了後は、以下のURLからご報告ください。';
      const link = document.getElementById('done-payment-link');
      link.href = paymentUrl;
      link.textContent = paymentUrl;
      document.getElementById('done-fallback').classList.remove('hidden');
    }

    const LIFF_ID = '2010105129-8clJHsYL';
    document.getElementById('close-btn').addEventListener('click', () => {
      liff.init({ liffId: LIFF_ID }).then(() => {
        if (liff.isInClient()) liff.closeWindow();
      }).catch(() => {});
    });
  </script>

</body>
</html>
