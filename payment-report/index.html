<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入金完了報告 | しろねこクリニック</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="/payment-report/style.css">
  <style>.hidden { display: none !important; }</style>
</head>
<body>

  <header class="header">
    <p class="header-logo">しろねこクリニック</p>
  </header>

  <main class="wrap">

    <!-- 報告ボタン画面 -->
    <div id="form-view">
      <p class="page-label">PAYMENT</p>
      <h1 class="page-title">入金完了のご報告</h1>
      <p class="page-desc">入金が完了しましたら、下のボタンを押してご報告ください。</p>

      <div class="order-box">
        <p class="order-label">注文番号</p>
        <p class="order-id" id="order-id-display">読み込み中...</p>
      </div>

      <button class="btn-submit" id="report-btn">入金完了を報告する</button>
    </div>

    <!-- 完了画面 -->
    <div id="done-view" class="done-view hidden">
      <div class="done-check">✓</div>
      <h2 class="done-title">報告を受け付けました</h2>
      <p class="done-text">確認次第、発送手続きを進めます。<br>しばらくお待ちください。</p>
      <button class="btn-close" id="close-btn">閉じる</button>
    </div>

    <!-- URLエラー画面 -->
    <div id="error-view" class="done-view hidden">
      <div class="done-check error-check">!</div>
      <h2 class="done-title">URLが正しくありません</h2>
      <p class="done-text">注文番号が確認できませんでした。<br>LINEトークのURLから再度アクセスしてください。</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/payment-report/form.js"></script>
</body>
</html>
