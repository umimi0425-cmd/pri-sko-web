<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入金完了報告 | スキンラボオンライン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);})(window,document,'script','dataLayer','GTM-WZQG78HT');</script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/payment-report/style.css">
  <style>.hidden { display: none !important; }</style>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WZQG78HT" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <header class="header">
    <p class="header-logo">スキンラボオンライン</p>
  </header>

  <main class="wrap">

    <!-- 報告ボタン画面 -->
    <div id="form-view">
      <p class="page-label">PAYMENT</p>
      <h1 class="page-title">支払い完了のご報告</h1>
      <p class="page-desc">お支払い（銀行振込・クレジットカードとも）が完了しましたら、下のボタンを押してご報告ください。</p>

      <div class="order-box">
        <p class="order-label">注文番号</p>
        <p class="order-id" id="order-id-display">読み込み中...</p>
      </div>

      <button class="btn-submit" id="report-btn">支払い完了を報告する</button>
      <p class="error-msg" id="report-error" style="text-align:center;margin-top:12px;"></p>
    </div>

    <!-- 完了画面 -->
    <div id="done-view" class="done-view hidden">
      <div class="done-check">✓</div>
      <h2 class="done-title">報告を受け付けました</h2>
      <p class="done-text">確認次第、発送手続きを進めます。<br>しばらくお待ちください。</p>
      <button class="btn-close" id="close-btn">閉じる</button>
    </div>

    <!-- URLエラー画面 -->
    <div id="error-view" class="done-view hidden">
      <div class="done-check error-check">!</div>
      <h2 class="done-title">URLが正しくありません</h2>
      <p class="done-text">注文番号が確認できませんでした。<br>LINEトークのURLから再度アクセスしてください。</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/payment-report/form.js"></script>
</body>
</html>
